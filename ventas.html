 
 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <meta name="description" content="Registro y administración de ventas de FrutaManía.">
    <link rel="icon" href="imagenes/Logoverduleria.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/estilo.css">

</head>

<body>
    <header>
        <nav class="barra">
            <img class="logo" src="imagenes/logo.png" alt="Logo Verduleria">

            <div class="menu center">
                <h1 class="brand-title">FrutaManía</h1>
                <div class="menu-links desktop-menu">
                    <a class="links" href="index.html">Inicio</a>
                    <a class="links" href="catalogo.html">Catalogo</a>
                    <a class="links" href="vendedores.html">Vendedores</a>
                    <a class="links" href="ventas.html">Ventas</a>
                </div>
            </div>

            <div class="mobile-menu">
                <div class="topnav">
                    <a href="index.html" class="active">Inicio</a>
                    <div id="myLinks">
                        <a href="catalogo.html">Catalogo</a>
                        <a href="vendedores.html">Vendedores</a>
                        <a href="ventas.html">Ventas</a>
                    </div>
                    <a href="#" class="icon" aria-label="Abrir menú" aria-expanded="false" aria-controls="myLinks">
                        <i class="fa fa-bars"></i>
                    </a>
                </div>
            </div>

            <div class="clima" aria-live="polite">
                <div class="clima-principal">
                    <span class="icono">🌤️</span>
                    <div>
                        <small>Colonia</small>
                        <strong>--°C</strong>
                    </div>
                </div>
                <div class="clima-datos">
                    <span>Sensación: --°C</span>
                    <span>Humedad: --%</span>
                </div>
            </div>
        </nav>
    </header>

    <header>
        <h1>FrutaManía</h1>
        <h2>ABM Ventas</h2>
    </header>

    <main class="contenedor">

        <form id="ventas">

            <section>

                <div class="row g-3 align-items-center">

                    <div class="col-md-4">
                        <label for="codigo" class="form-label"> Código:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text" id="codigo" class="form-control" min="1" step="1" placeholder="Ej: 312">
                    </div>


            
                    <div class="col-md-4">
                        <label for="fecha" class="form-label">Fecha:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="date" id="fecha" class="form-control">
                    </div>


                   
                    <div class="col-md-4">
                        <label for="codigo-vendedor" class="form-label"> Vendedor:</label>
                    </div>

                    <div class="col-md-8">
                        <select id="codigo-vendedor" class="form-select"> </select>
                    </div>


                   
                    <div class="col-md-4">
                        <label for="codigo-catalogo" class="form-label">Catálogo:</label>
                    </div>

                    <div class="col-md-8">
                        <select id="codigo-catalogo" class="form-select"></select>
                    </div>

                    <div class="col-md-4">
                        <label for="precio-catalogo" class="form-label">Precio:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text" id="precio-catalogo"class="form-control" disabled>
                    </div>


                   
                    <div class="col-md-4">
                        <label for="cantidad" class="form-label">Cantidad:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text" id="cantidad" class="form-control" min="1" step="1" placeholder="Ej: 6">
                    </div>


                    
                    <div class="col-md-4">
                        <label for="total" class="form-label">Total:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text" id="total" class="form-control" disabled>
                    </div>

                </div>


               
                <div class="botones" id="botones-ventas">

                    <input id="btnAgregarVenta"class="btn btn-light"type="button"value="Agregar">

                    <input id="btnModificarVenta" class="btn btn-light"type="button"value="Modificar">

                    <input id="btnEliminarVenta"class="btn btn-light"type="button"value="Eliminar">

                    <input id="btnLimpiarVenta"class="btn btn-light"type="button"value="Limpiar">

                </div>

            </section>

        </form>

        <section class="listado"><label for="lista-ventas">Listado de Ventas Realizadas</label>

        <select id="lista-ventas" class="form-select" size="6"></select>

        </section>

    </main>

    <script src="dominio/controller/modal.js"></script>
    <script type="module" src="dominio/controller/VentasABM.js"></script> 
</body>
</html>
