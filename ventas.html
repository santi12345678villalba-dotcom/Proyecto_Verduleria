<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link rel="icon" href="imagenes/Logoverduleria.png" type="image/png">
    <script type="module" src="./dominio/controller/VentasABM.js"></script>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body  class="bodyve">

<header>
 
   
    <nav class="barra">
        <img class="logo" src="imagenes/logo.png" alt="Logo Verduleria">

            <div class="menu center">
                <h1 style="color: white;">FrutaManía</h1>
                <a class="links" href="catalogo.html">Catalogo</a>
                <a class="links" href="vendedores.html">Vendedores</a>
                <a class="links" href="ventas.html">Ventas</a>
                
            </div>
        <img class="logo" src="imagenes/logo.png" alt="Logo Verduleria"> 
    </nav>
   
   
 <h2>ABM Ventas</h2>
</header>

<main>
        <form id="ventas">
            <section>
                <div class="campos">

                    <label for="codigo">Codigo:</label>
                    <input type="number" id="codigo" placeholder="Ej: 312">

                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha">
                    
                    <label for="codigo-vendedor">Vendedor:</label>
                    <select id="codigo-vendedor"></select>
                    

                    <label for="codigo-catalogo">Catalogo:</label>
                    <select id="codigo-catalogo" onchange="CargarPrecioCatalogo()"></select>
                    
                    <label for="precio-catalogo">Precio:</label>
                    <input type="number" id="precio-catalogo" disabled>
                    
                    <label for="cantidad">Cantidad:</label>
                    <input type="text" id="cantidad" onblur="CalculoTotal()" placeholder="Ej: 6">
                    
                    <label for="total">Total:</label>
                    <input type="text" id="total" disabled>

                </div>
 
                <div class="botones">
               
                    <input id="btnAgregarVenta" class="btn_agregar" type="button"  value="Agregar"  >
                    <input id="btnModificarVenta" class="btn_modificar" type="button" value="Modificar" >
                    <input id="btnEliminarVenta" class="btn_eliminar" type="button" value="Eliminar" >
                    <input id="btnLimpiarVenta" class="btn_limpiar" type="button" value="Limpiar" >

                </div>
            </section>
        </form>

        <section class="listado">
            <label for="lista-ventas">Listado de Ventas Realizadas</label>
            <select  onclick="SeleccionarVenta()" id="lista-ventas" size="6"></select>
        </section>

</main>

</body>
</html>
