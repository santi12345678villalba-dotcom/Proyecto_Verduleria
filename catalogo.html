<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATALOGO</title>
    <link rel="icon" href="imagenes/Logoverduleria.png" type="image/png"> 
     <script type="module" src="dominio/controller/CatalogoABM.js"></script>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body class="bodyc">
    <header>
        <nav class="barra">
            <img class="logo" src="imagenes/logo.png" alt="Logo Verduleria">

            <div class="menu center">
                <h1 style="color: white;">FrutaManía</h1>
                <div class="menu-links desktop-menu">
                    <a class="links" href="index.html">Inicio</a>
                    <a class="links" href="catalogo.html">Catalogo</a>
                    <a class="links" href="vendedores.html">Vendedores</a>
                    <a class="links" href="ventas.html">Ventas</a>
                </div>
            </div>

            <div class="mobile-menu">
                <div class="topnav">
                    <a href="index.html" class="active">Inicio</a>
                    <div id="myLinks">
                        <a href="catalogo.html">Catalogo</a>
                        <a href="vendedores.html">Vendedores</a>
                        <a href="ventas.html">Ventas</a>
                    </div>
                    <a href="#" class="icon" aria-label="Abrir menú">
                        <i class="fa fa-bars"></i>
                    </a>
                </div>
            </div>

            <div class="clima" aria-live="polite">
                <div class="clima-principal">
                    <span class="icono">🌤️</span>
                    <div>
                        <small>Colonia</small>
                        <strong>--°C</strong>
                    </div>
                </div>
                <div class="clima-datos">
                    <span>Sensación: --°C</span>
                    <span>Humedad: --%</span>
                </div>
            </div>
        </nav>
    </header>

<main class="contenedor">
        <form id="catalogo">
            <section>
                
                <div class="row g-3 align-items-center">

                <div class="col-md-4">
                    <label for="codigo" class="form-label">Código:</label>
                </div>
                <div class="col-md-8">
                    <input type="text" id="codigo" class="form-control" placeholder="Ej: 123">
                </div>

                <div class="col-md-4">
                    <label for="nombre" class="form-label">Nombre:</label>
                </div>
                <div class="col-md-8">
                    <input type="text" id="nombre" class="form-control" placeholder="Ej: Manzana">
                </div>

                <div class="col-md-4">
                    <label for="descripcion" class="form-label">Descripción:</label>
                </div>
                <div class="col-md-8">
                    <textarea id="descripcion" class="form-control" rows="3"
                            placeholder="Ej: Manzana Verde de primera calidad"></textarea>
                </div>

                <div class="col-md-4">
                    <label for="precio" class="form-label">Precio:</label>
                </div>
                <div class="col-md-8">
                    <input type="text" id="precio" class="form-control" placeholder="Ej: 25">
                </div>

                <div class="col-md-4">
                    <label for="stock" class="form-label">Stock:</label>
                </div>
                <div class="col-md-8">
                    <input type="text" id="stock" class="form-control" placeholder="Ej: 45">
                </div>

                <div class="col-md-4">
                    <label for="foto" class="form-label">Nombre de la foto:</label>
                </div>
                <div class="col-md-8">
                    <input type="text" id="foto" class="form-control" placeholder="Ej: fruta.png">
                </div>

                </div>


                <div class="botones" id="botones-catalogos">
                    <input id="btnAgregarCatalogo" class="btn btn-light border-success" type="button" value="Agregar">
                    <input id="btnModificarCatalogo" class="btn btn-light border-success" type="button" value="Modificar">
                    <input id="btnEliminarCatalogo" class="btn btn-light border-success" type="button" value="Eliminar">
                    <input id="btnLimpiarCatalogo" class="btn btn-light border-success" type="button" value="Limpiar">
                </div>
            </section>
        </form>

        <section class="listado">
            <label for="lista-catalogos">Catalogo de Frutas y Verduras</label>
           <select onclick="SeleccionarCatalogo()" id="lista-catalogos"  class="form-select" size="6">
        </select>
        </section>
        
        <div id="contenedorCatalogo" class="tabla-Catalgo"></div>

    </main>

    <script type="module" src="dominio/controller/IndexController.js"></script>
    <script type="module" src="dominio/controller/CatalogoABM.js"></script>

    </body>
</html>
