<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATALOGO</title>
    <link rel="icon" href="imagenes/Logoverduleria.png" type="image/png"> 
     <script type="module" src="dominio/controller/CatalogoABM.js"></script>
    <link rel="stylesheet" href="css/estilo.css">

</head>
<body class="bodyc">  
   <a  class="linksCatalogo" href="index.html">Volver</a>

  <header>
 
    <h1>FrutaManía</h1>
   <h2>ABM Catalogo</h2>
 </header>

<main class="contenedor">
        <form id="catalogo">
            <section>
                
                <div class="campos">
                    <label for="codigo">Codigo:</label>
                    <input type="text" id="codigo" placeholder="Ej: 123">
                    
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Manzana">
                    
                    <label for="descripcion">Descripcion:</label>
                    <textarea id="descripcion" rows="3" placeholder="Ej: Manzana Verde de primera calidad"></textarea>
                    
                    <label for="precio">precio:</label>
                    <input type="text" id="precio" placeholder="Ej: 25">
                    
                    <label for="stock">stock:</label>
                    <input type="text" id="stock" placeholder="Ej: 45">
                   
                     <label for="foto">Nombre de la foto</label>
      <input type="text" id="foto" placeholder="Ej: fruta.png">                    
                </div>

                <div class="botones">
                    <input id="btnAgregarCatalogo" class="btn_agregar" type="button"  value="Agregar"  >
                    <input id="btnModificarCatalogo" class="btn_modificar" type="button" value="Modificar" >
                    <input id="btnEliminarCatalogo" class="btn_eliminar" type="button" value="Eliminar" >
                    <input id="btnLimpiarCatalogo" class="btn_limpiar" type="button" value="Limpiar" >

                </div>
            </section>
        </form>

        <section class="listado">
            <label for="lista-catalogos">Catalogo de Frutas y Verduras</label>
            <select  onclick="SeleccionarCatalogo()" id="lista-catalogos" size="6"  ></select>
        </section>
        
        <div id="contenedorCatalogo" class="tabla-Catalgo"></div>

    </main>
    </main>

       

    </body>
</html>
