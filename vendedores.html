<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedores</title>
    <link rel="icon" href="imagenes/Logoverduleria.png" type="image/png">
    <script type="module" src="dominio/controller/VendedoresABM.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body class="bodyven">
    <header>
        <nav class="barra">
            <img class="logo" src="imagenes/logo.png" alt="Logo Verduleria">

            <div class="menu center">
                <h1 style="color: white;">FrutaManía</h1>
                <div class="menu-links desktop-menu">
                    <a class="links" href="index.html">Inicio</a>
                    <a class="links" href="catalogo.html">Catalogo</a>
                    <a class="links" href="vendedores.html">Vendedores</a>
                    <a class="links" href="ventas.html">Ventas</a>
                </div>
            </div>

            <div class="mobile-menu">
                <div class="topnav">
                    <a href="index.html" class="active">Inicio</a>
                    <div id="myLinks">
                        <a href="catalogo.html">Catalogo</a>
                        <a href="vendedores.html">Vendedores</a>
                        <a href="ventas.html">Ventas</a>
                    </div>
                    <a href="#" class="icon" aria-label="Abrir menú">
                        <i class="fa fa-bars"></i>
                    </a>
                </div>
            </div>

            <div class="clima" aria-live="polite">
                <div class="clima-principal">
                    <span class="icono">🌤️</span>
                    <div>
                        <small>Colonia</small>
                        <strong>--°C</strong>
                    </div>
                </div>
                <div class="clima-datos">
                    <span>Sensación: --°C</span>
                    <span>Humedad: --%</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="contenedor">

        <form id="vendedores">

            <section class="vendedores">

                <h3>Datos del vendedor</h3>

                <div class="row g-3 align-items-center">

                    <div class="col-md-4">
                        <label for="codigo" class="form-label">Código:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text" id="codigo"class="form-control"placeholder="Ej: 34">
                    </div>

                    
                    <div class="col-md-4">
                        <label for="nombre" class="form-label">Nombre:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text"id="nombre"class="form-control" placeholder="Ej: Luis Fernandez">
                    </div>

                    <div class="col-md-4">
                        <label for="cedula" class="form-label">Cédula:</label>
                    </div>

                    <div class="col-md-8">
                        <input type="text" id="cedula"class="form-control"placeholder="Ej: 41663215"></div>

                </div>

               
                <div class="botones">

                    <input id="btnAgregarVendedor"class="btn btn-light border-success" type="button" value="Agregar">

                    <input id="btnModificarVendedor"class="btn btn-light border-success" type="button" value="Modificar">

                    <input id="btnEliminarVendedor" class="btn btn-light border-success" type="button" value="Eliminar">

                    <input id="btnLimpiarVendedor" class="btn btn-light border-success" type="button" value="Limpiar">

                </div>

            </section>

        </form>

        <section class="listado">

            <label for="lista-vendedores"> Lista de vendedores</label>

            <select id="lista-vendedores" class="form-select" size="6" onclick="SeleccionarVendedor()"> </select>

        </section>

    </main>

    <script type="module" src="dominio/controller/IndexController.js"></script>
    <script type="module" src="dominio/controller/VendedoresABM.js"></script>

</body>
</html>
