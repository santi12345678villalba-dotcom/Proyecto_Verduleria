<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedores</title>
    <link rel="icon" href="imagenes/Logoverduleria.png" type="image/png">
    <script type="module" src="dominio/controller/VendedoresABM.js" ></script>
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body onload="CargoDatosVendedor()" class="bodyven">
<a class="links" href="index.html">Volver</a>

<header>
 <h1>FrutaManía</h1> 
<h2>ABM Vendedores</h2>
</header>


<main>
        <form id="vendedores">
            <section class="vendedores">
                <h3>Datos del vendedor</h3>
                <div class="campos">
                    <label for="codigo">Codigo:</label>
                    <input type="text" id="codigo" placeholder="Ej: 34">
                    
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Luis Fernandez">
                    

                    <label for="cedula">cedula:</label>
                    <input type="text" id="cedula" placeholder="Ej: 41663215">

                </div>

                <div class="botones">                                                       
                 <button type="button" class="btn_agregar" onclick="AgregarVendedor()">Agregar</button>
                 <button type="button" class="btn_modificar" onclick="ModificarVendedor()">Modificar</button>
                 <button type="button" class="btn_eliminar" onclick="EliminarVendedor()">Eliminar</button>
                 <button class="btn_limpiar" type="button" onclick="LimpiarVendedor()">Limpiar</button>
                </div>
            </section>
        </form>

        <section class="listado">
           <label for="lista-vendedores">Lista de vendedores</label>
           <select id="lista-vendedores"size="6" onclick="SeleccionarVendedor()"></select>
        </section>
</main>


</body>
</html>
